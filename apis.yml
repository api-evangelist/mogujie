description: Mogujie (蘑菇街), operated by Mogu Inc. (NYSE MOGU), is a Chinese online
  fashion and lifestyle social-commerce destination that pairs a shopping marketplace
  with live video streaming and influencer-led content across apparel, beauty, and
  accessories. The company was formed from the 2016 merger of Mogujie and Meilishuo,
  is headquartered in Hangzhou, China, and listed on the New York Stock Exchange in
  December 2018. Mogujie's historical third-party open platform (open.mogujie.com)
  has been retired and now redirects away, and no active public API developer surface
  was found during enrichment.
